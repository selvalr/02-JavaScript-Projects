<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Filter Gallery</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="control">
      <div class="btn-group">
        <button class="btn btn-clicked" data-filter="all">All</button>
        <button class="btn" data-filter="pizza">Pizza</button>
        <button class="btn" data-filter="cake">Cake</button>
        <button class="btn" data-filter="icecream">Ice Cream</button>
      </div>

      <input type="text" placeholder="Search Food" id="search" />
    </div>
    <div class="container">
      <div class="box" data-item="icecream">
        <img src="./images/ice1.jpg" alt="" />
      </div>
      <div class="box" data-item="cake">
        <img src="./images/cake1.jpg" alt="" />
      </div>
      <div class="box" data-item="pizza">
        <img src="./images/pizza1.jpg" alt="" />
      </div>

      <div class="box" data-item="icecream">
        <img src="./images/ice2.jpg" alt="" />
      </div>
      <div class="box" data-item="cake">
        <img src="./images/cake2.jpg" alt="" />
      </div>
      <div class="box" data-item="pizza">
        <img src="./images/pizza2.jpg" alt="" />
      </div>

      <div class="box" data-item="icecream">
        <img src="./images/ice3.jpg" alt="" />
      </div>
      <div class="box" data-item="cake">
        <img src="./images/cake3.jpg" alt="" />
      </div>
      <div class="box" data-item="pizza">
        <img src="./images/pizza3.jpg" alt="" />
      </div>

      <div class="box" data-item="icecream">
        <img src="./images/ice4.jpg" alt="" />
      </div>
      <div class="box" data-item="cake">
        <img src="./images/cake4.jpg" alt="" />
      </div>
      <div class="box" data-item="pizza">
        <img src="./images/pizza4.jpg" alt="" />
      </div>

      <div class="box" data-item="icecream">
        <img src="./images/ice5.jpg" alt="" />
      </div>
      <div class="box" data-item="cake">
        <img src="./images/cake5.jpg" alt="" />
      </div>
      <div class="box" data-item="pizza">
        <img src="./images/pizza5.jpg" alt="" />
      </div>
    </div>

    <script src="./script/script.js"></script>
  </body>
</html>
